<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Quiz Form</title>
    <link rel="stylesheet" href="quiz.css">

</head>

<body>
    <main>
        <h1>Basic HTML and CSS Quiz</h1>
        <form action="">
            <div class="quiz-item">
                <label>1.What does the acronym CSS stand for you?
                    <input type="text" id="q1" name="q1"></label>
            </div>
            <div class="quiz-item">
                <label>2. How are id and class atributes selected in CSS?
                    <textarea id="q2" name="q2"></textarea></label>
            </div>
            <div class="quiz-item">
                <label>3.Which the following is a valid CSS comment?
                    <select id="q3" name="q3">
                        <option value="" select disabled>Choose One...</option>
                        <option value="a">A.&lt;!--This is a comment--!&gt;</option>
                        <option value="b">B./* This is a comment*/</option>
                        <option value="c">C.//This is a coment</option>
                    </select></label>

            </div>
            <div class="quiz-item">
                <label>4.What is the bottom margin given this declaration?
                    <code>margin: 10px 5px 15px</code>
                    <input type="number" id="q4" name="q4"></label>
            </div>
        </form>


    </main>
</body>

</html>
